server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=()" always;
  # The pinned SDK loads its model, WASM loader and device compatibility file
  # from this versioned vendor directory only after explicit camera start.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' blob: https://content.careplix.com/careplix-scan-sdk-models/1.3.0/; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://content.careplix.com/careplix-scan-sdk-models/1.3.0/; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Match the API's bounded signal contract instead of nginx's 1 MiB default.
  location ~ ^/api/v1/organizations/[^/]+/assessments/[^/]+/face-scans/[^/]+/signal$ {
    client_max_body_size 2m;
    client_body_timeout 30s;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    # Matches bounded report uploads; PDF rendering can exceed nginx's 60s default.
    client_max_body_size 12m;
    proxy_read_timeout 750s;
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
